<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="style/nav.css">
</head>
<body>

<div class="d-flex p-3 gap-3">

  <div class="sidebar position-relative">

    <div class="logo">
      <img src="img/agil_logo.png" alt="">
    </div>

    <ul class="nav flex-column">
      <li><a href="#" class="nav-link"><i class="bi bi-grid"></i> Início</a></li>
      <li><a href="#" class="nav-link"><i class="bi bi-box"></i> Produtos</a></li>
      <li><a href="#" class="nav-link"><i class="bi bi-file-earmark"></i> Histórico</a></li>
      <li><a href="#" class="nav-link"><i class="bi bi-bell"></i> Notificação</a></li>
      <li><a href="#" class="nav-link"><i class="bi bi-people"></i> Funcionários</a></li>
    </ul>

    <div class="nav-bottom">
      <a href="#" class="nav-link">
        <i class="bi bi-question-circle"></i> Ajuda
      </a>
    </div>
  </div>

  <div class="flex-grow-1">

    <div class="header d-flex align-items-center justify-content-between">

      <div class="search-box w-50 position-relative">
        <input type="text" class="form-control rounded-pill ps-4 pe-5" placeholder="Buscar">
        <i class="bi bi-search position-absolute top-50 end-0 translate-middle-y me-3"></i>
      </div>

      <div class="user d-flex align-items-center gap-2">
        <span class="fw-medium">Claudia Alves</span>
        <img src="img/claudia_alves.png" class="rounded-circle" width="35">
      </div>

    </div>

    <div class="welcome-card">
      <h4>Bem-vindo ao Sistema de Estoque</h4>
      <small>Gerencie seus produtos, acompanhe o consumo e evite falhas ou desperdícios.</small>
    </div>
  </div>
</div>

</body>
</html>
