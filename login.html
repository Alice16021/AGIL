<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="styles/log.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="icon" href="img/Design_sem_nome__2_-removebg-preview.png">

</head>

<body>
  <div class="login-container">
    <div class="login-card">

      <div class="login-form">
        <img src="img/Logo_semfundo.png" class="img-fluid mb-3" style="max-width: 90px;" alt="Logo">
        <h2>Bem-vindo!</h2>
        <p></p>

        <form>
          <div class="input-group">
            <label>E-mail</label>
            <input type="email" placeholder="seu@email.com">
          </div>
          <div class="input-group">
            <label>Senha</label>
            <input type="password" placeholder="••••••••">
          </div>
          <p><a href="#" class="text-reset text-decoration-underline">Esqueceu a senha?</a></p>
          <button type="submit" class="btn-login"><a href="inicio-gestor.html" class="text-reset text-decoration-none">Entrar</a></button>
          <button type="submit" class="btn-login1"><i class="bi bi-globe2"></i> <a href="cadastro.html"
              class="text-reset text-decoration-none">Cadastre-se</a></button>
        </form>
      </div>

      <div class="login-image">
        <img src="img/Login.png" alt="Login Image">
      </div>

    </div>
  </div>
</body>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</html>
